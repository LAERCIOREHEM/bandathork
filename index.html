<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Banda THORK</title>
  <meta name="description" content="Site oficial da Banda THORK — Brasília-DF" />
  <meta property="og:title" content="Banda THORK" />
  <meta property="og:description" content="Hard rock e heavy metal clássico." />
  <meta property="og:type" content="website" />
  <style>
    html,body{
      height:100%;
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;
      background:#0b0b0b;
      color:#f5f5f5;
    }
    .wrap{
      min-height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:24px;
      text-align:center;
    }
    img{
      max-width:600px;  /* antes era 320px */
      width:100%;
      height:auto;
      display:block;
      margin:0 auto 16px auto;
    }
    h2{
      font-weight:400;
      font-size:1.2rem;
      margin:0 0 32px 0;
      opacity:0.85;
    }
    a.btn{
      display:inline-block;
      padding:12px 20px;
      border:1px solid #f5f5f5;
      text-decoration:none;
      color:#f5f5f5;
      border-radius:999px;
    }
    a.btn:hover{
      background:#f5f5f5;
      color:#0b0b0b;
    }
    footer{
      position:fixed;
      bottom:12px;
      left:0;
      right:0;
      text-align:center;
      opacity:.7;
      font-size:.85rem;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img src="ThorkPNG.png" alt="Logo da Banda THORK" />
    <h2>Thork: o torque que move o rock.</h2>
    <a class="btn" href="https://instagram.com/bandathork" target="_blank" rel="noopener">Siga no Instagram</a>
  </main>
  <footer>© <span id="y"></span> Banda THORK</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
